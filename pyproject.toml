[project]
name = "mcphybridrag-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhisek-RSV", email = "abhishek@rsageventures.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "mcp[cli]>=1.20,<2",
]

[project.scripts]
mcphybridrag-server = "mcphybridrag_server:main"
mcphybridrag-ingest = "mcphybridrag_server.ingest:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
